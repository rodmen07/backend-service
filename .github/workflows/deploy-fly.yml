name: Deploy Backend (Fly)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Legacy deployment warning
        run: |
          echo "This Fly.io deployment workflow is legacy and manual-only."
          echo "Primary production deployment is handled by deploy-cloud-run.yml."

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}