name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rustExpected:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        # Scoped to lib/bin unit tests. The tests/ integration suite still
        # targets SQLite URLs from before the Postgres migration, so it cannot
        # run until it is ported to a Postgres test instance.
        run: cargo test --lib --bins --all-features
